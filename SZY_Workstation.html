<style>

idth:100%;border-collapse:collapse;min-width:690px}th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;background:#fafafb}th,td{padding:10px 8px;border-bottom:1px solid #edf0f2;vertical-align:middle}th:first-child,td:first-child{padding-left:12px}tbody tr:hover{background:#fcfbfe}tbody tr:last-child td{border-bottom:0}.taskname{font-weight:550;text-align:left;padding:3px 0;word-break:break-word}.taskname.done{text-decoration:line-through;color:var(--muted)}.tasknote{font-size:11px;color:var(--muted);max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}.status{border:0;border-radius:6px;padding:5px 7px;font-size:12px;font-weight:600;max-width:126px}.s0{background:#edf0f3;color:#525e6a}.s1{background:#e6edff;color:#30549e}.s2{background:#dff2e8;color:#216d4b}.s3{background:#ffe6e4;color:#a53b32}.date{border:1px solid transparent;background:transparent;font-size:12px;max-width:130px;padding:4px}.date:hover{border-color:var(--line)}.prio{border:0;background:transparent;font-size:12px;max-width:82px}.empty{text-align:center;padding:45px 15px;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:8px;font-size:16px}.quick{border-top:1px solid var(--line);display:flex;padding:12px;gap:8px}.quick input{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:8px 10px}.footnote{font-size:12px;color:var(--muted);margin-top:14px}.overlay{position:fixed;inset:0;background:#1d203966;display:grid;place-items:center;padding:18px;z-index:5}.overlay[hidden]{display:none}.dialog{width:min(100%,450px);background:white;border-radius:14px;padding:22px;box-shadow:0 20px 60px #1a15352b}.dialog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.field{display:block;margin:12px 0}.field span{display:block;font-size:12px;font-weight:600;margin-bottom:5px}.field input,.field textarea,.field select{display:block;width:100%;border:1px solid var(--line);border-radius:7px;padding:9px;background:white}.field textarea{min-height:80px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.danger{color:#aa3030}.toast{position:fixed;bottom:18px;right:18px;background:#29243c;color:white;border-radius:8px;padding:11px 15px;z-index:10;max-width:90vw}.toast[hidden]{display:none}.subcheck{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.subcheck input{width:13px;height:13px}.subrow{display:flex;gap:7px;align-items:center;margin:5px 0}.subrow input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:6px}.subrow input[type=checkbox]{flex-shrink:0}.subhead{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-weight:600;font-size:12px}.small{font-size:12px}.row-actions{display:flex;gap:2px;white-space:nowrap}.mobile-toggle{display:none}@media(max-width:760px){header{height:auto;min-height:64px;padding:10px 12px;flex-wrap:wrap}.brand strong{font-size:14px}.header-actions{margin-left:auto;gap:4px}.save{display:none}.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}aside.closed .side-content{display:none}.mobile-toggle{display:inline-block}main{padding:22px 12px}.stats{gap:6px}.stat{padding:10px 8px}.stat b{font-size:21px}.stat span{font-size:11px}.toolbar{gap:6px}h1{font-size:25px}.header-actions button{font-size:12px;padding:6px}.tip{margin:8px}.side-head{margin-bottom:2px}}
</style></head><body>
<header><div class="brand"><div class="logo">SZY</div><div><strong>Lists Workstation</strong><small>Company workspace</small></div></div><div class="header-actions"><span class="save" id="saveState">Local storage</span><button class="outline" id="export">Export backup</button><button class="outline" id="import">Import</button><input type="file" id="importFile" accept=".json,application/json" hidden></div></header>
<div class="layout"><aside id="sidebar"><div class="side-head"><strong>MY WORKSPACE</strong><div><button class="icon mobile-toggle" id="toggleSide" aria-label="Toggle workspace">☰</button><button class="icon" id="newGroup" title="New group">＋ Group</button></div></div><div class="side-content"><div id="groups"></div><div class="tip">Drag ⋮⋮ to reorder groups, lists and tasks. Drop a list into another group to move it.</div></div></aside><main id="main"></main></div>
<div class="overlay" id="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-top"><h2 id="dialogTitle"></h2><button class="icon" id="closeDialog" aria-label="Close">✕</button></div><form id="dialogForm"><div id="dialogBody"></div><div class="actions"><button type="button" class="outline" id="cancelDialog">Cancel</button><button class="primary" type="submit" id="dialogSubmit">Save</button></div></form></section></div><div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';const $=id=>document.getElementById(id),KEY='szy-lists-workstation-v1',statuses=['Not started','In progress','Done','Blocked'],priorities=['Low','Normal','High'];const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const starter=()=>({groups:[{id:uid(),name:'General',lists:[{id:uid(),name:'My first list',description:'',tasks:[]}]}],selected:null});let state,storageError=false;try{const raw=localStorage.getItem(KEY);state=raw?normalize(JSON.parse(raw)):starter()}catch(e){state=starter();storageError=true}let query='',filter='All',drag=null,modalSubmit=null,toastTimer;function normalize(v){if(!v||!Array.isArray(v.groups))throw Error('Invalid backup');const ids=new Set();const id=x=>{let s=typeof x==='string'&&/^[\w-]{1,100}$/.test(x)?x:uid();if(ids.has(s))s=uid();ids.add(s);return s};const str=x=>typeof x==='string'?x:'';const groups=v.groups.map(g=>{if(!g||!Array.isArray(g.lists))throw Error('Invalid group');return {id:id(g.id),name:str(g.name)||'Untitled group',lists:g.lists.map(l=>{if(!l||!Array.isArray(l.tasks))throw Error('Invalid list');return {id:id(l.id),name:str(l.name)||'Untitled list',description:str(l.description),tasks:l.tasks.map(t=>{if(!t||typeof t!=='object')throw Error('Invalid task');return {id:id(t.id),name:str(t.name)||'Untitled task',status:statuses.includes(t.status)?t.status:statuses[0],priority:priorities.includes(t.priority)?t.priority:'Normal',due:/^\d{4}-\d{2}-\d{2}$/.test(str(t.due))?t.due:'',notes:str(t.notes),subtasks:Array.isArray(t.subtasks)?t.subtasks.filter(s=>s&&typeof s==='object').map(s=>({id:id(s.id),name:str(s.name),done:!!s.done})):[]}})}})}});return {groups,selected:typeof v.selected==='string'?v.selected:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageError=false;$('saveState').textContent='✓ Saved on this device'}catch(e){storageError=true;$('saveState').textContent='Not saved — export backup';notify('Local saving unavailable. Export a backup to keep your changes.')}}function notify(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}function findList(id){for(const g of state.groups){const l=g.lists.find(l=>l.id===id);if(l)return {g,l}}return null}function current(){return findList(state.selected)}function ensureSelection(){if(!current())state.selected=state.groups.flatMap(g=>g.lists)[0]?.id||null}function commit(){ensureSelection();save();render()}function selectList(id){state.selected=id;query='';filter='All';commit()}function option(v,selected){return `<option${v===selected?' selected':''}>${esc(v)}</option>`}function grip(type,id){return `<span class="grip" draggable="true" data-drag="${type}" data-id="${esc(id)}" title="Drag to move" aria-label="Drag to move">⋮⋮</span>`}
function render(){renderSide();renderMain()}function renderSide(){$('groups').innerHTML=state.groups.map(g=>`<section class="group" data-drop="group" data-id="${esc(g.id)}"><div class="group-head">${grip('group',g.id)}<span class="group-name" title="${esc(g.name)}">${esc(g.name)}</span><button class="icon" data-action="editGroup" data-id="${esc(g.id)}" title="Rename group">✎</button><button class="icon danger" data-action="deleteGroup" data-id="${esc(g.id)}" title="Delete group">×</button></div><div class="children">${g.lists.map(l=>`<div class="list-item ${l.id===state.selected?'selected':''}" data-drop="list" data-id="${esc(l.id)}">${grip('list',l.id)}<button class="list-label" data-action="select" data-id="${esc(l.id)}" title="${esc(l.name)}">▤ &nbsp;${esc(l.name)}</button><span class="list-count">${l.tasks.length}</span><button class="icon" data-action="editList" data-id="${esc(l.id)}" title="Edit or move list">⋯</button></div>`).join('')}<button class="add-list" data-action="addList" data-id="${esc(g.id)}">＋ New list</button></div></section>`).join('')||'<div class="tip">Create a group to get started.</div>'}
function renderMain(){const c=current();if(!c){$('main').innerHTML='<div class="empty"><strong>Your workspace is ready</strong>Create a group and a list to start organising your tasks.<br><br><button class="primary" data-action="newGroup">＋ New group</button></div>';return}const {g,l}=c,done=l.tasks.filter(t=>t.status==='Done').length,percent=l.tasks.length?Math.round(done/l.tasks.length*100):0;const stats=[['All','Total tasks',l.tasks.length],['Not started','Not started',l.tasks.filter(t=>t.status==='Not started').length],['In progress','In progress',l.tasks.filter(t=>t.status==='In progress').length],['Done','Completed',done]];$('main').innerHTML=`<div class="crumb">Workspace / ${esc(g.name)}</div><div class="page-title"><h1>${esc(l.name)}</h1><button class="icon" data-action="editList" data-id="${esc(l.id)}" title="List settings">✎ Edit list</button></div><div class="description">${esc(l.description||'Manage tasks, track progress and keep work organised.')}</div><div class="stats">${stats.map(([f,n,k])=>`<button class="stat ${filter===f?'active':''}" data-action="filter" data-id="${f}"><span>${n}</span><b>${k}</b></button>`).join('')}</div><div class="progress" title="${percent}% complete"><div style="width:${percent}%"></div></div><section class="workspace"><div class="toolbar"><button class="primary" data-action="addTask">＋ New task</button><input id="search" class="search" placeholder="Search tasks…" aria-label="Search tasks" value="${esc(query)}"><select id="statusFilter" aria-label="Filter status">${['All',...statuses].map(s=>option(s,filter)).join('')}</select><button class="outline" data-action="clearFilters">Clear filters</button></div><div class="scroll" id="taskTable"></div><form class="quick" id="quickForm"><input id="quickName" placeholder="Add a task…" aria-label="New task name" required maxlength="300"><button class="outline" type="submit">＋ Add</button></form></section><div class="footnote" id="taskCount"></div>`;renderRows();$('search').addEventListener('input',e=>{query=e.target.value;renderRows()});$('statusFilter').addEventListener('change',e=>{filter=e.target.value;renderMain()});$('quickForm').addEventListener('submit',e=>{e.preventDefault();const n=$('quickName').value.trim();if(n){l.tasks.push(newTask(n));commit();$('quickName')?.focus()}})}
function newTask(name){return {id:uid(),name,status:statuses[0],priority:'Normal',due:'',notes:'',subtasks:[]}}
function renderRows(){const c=current();if(!c||!$('taskTable'))return;const tasks=c.l.tasks.filter(t=>(filter==='All'||t.status===filter)&&[t.name,t.notes,t.status,t.priority,...t.subtasks.map(s=>s.name)].join(' ').toLowerCase().includes(query.toLowerCase()));$('taskTable').innerHTML=tasks.length?`<table><thead><tr><th style="width:24px"></th><th style="width:30px">✓</th><th>Task</th><th>Status</th><th>Due date</th><th>Priority</th><th></th></tr></thead><tbody>${tasks.map(t=>`<tr data-drop="task" data-id="${esc(t.id)}"><td>${grip('task',t.id)}</td><td><input type="checkbox" data-field="done" data-id="${esc(t.id)}" aria-label="Complete ${esc(t.name)}" ${t.status==='Done'?'checked':''}></td><td><button class="taskname ${t.status==='Done'?'done':''}" data-action="editTask" data-id="${esc(t.id)}">${esc(t.name)}</button>${t.notes?`<div class="tasknote" title="${esc(t.notes)}">${esc(t.notes)}</div>`:''}${t.subtasks.length?`<div class="subcheck">☑ ${t.subtasks.filter(s=>s.done).length}/${t.subtasks.length} checklist items</div>`:''}</td><td><select class="status s${statuses.indexOf(t.status)}" data-field="status" data-id="${esc(t.id)}" aria-label="Task status">${statuses.map(s=>option(s,t.status)).join('')}</select></td><td><input class="date" type="date" data-field="due" data-id="${esc(t.id)}" value="${esc(t.due)}" aria-label="Due date"></td><td><select class="prio" data-field="priority" data-id="${esc(t.id)}" aria-label="Priority">${priorities.map(s=>option(s,t.priority)).join('')}</select></td><td><div class="row-actions"><button class="icon" data-action="editTask" data-id="${esc(t.id)}" title="Edit task">✎</button><button class="icon" data-action="moveTask" data-id="${esc(t.id)}" title="Move task to another list">↗</button><button class="icon danger" data-action="deleteTask" data-id="${esc(t.id)}" title="Delete task">×</button></div></td></tr>`).join('')}</tbody></table>`:`<div class="empty"><strong>${c.l.tasks.length?'No matching tasks':'No tasks yet'}</strong>${c.l.tasks.length?'Try clearing your filters.':'Add your first task using the button above or the quick-add box below.'}</div>`;$('taskCount').textContent=`${tasks.length} of ${c.l.tasks.length} tasks shown · ${c.l.tasks.filter(t=>t.status==='Done').length} completed`+(storageError?' · Local saving unavailable; export a backup.':'')}
function openModal(title,html,cb,label='Save'){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=html;$('dialogSubmit').textContent=label;modalSubmit=cb;$('overlay').hidden=false;setTimeout(()=>$('dialogBody').querySelector('input,select,textarea')?.focus(),0)}function closeModal(){$('overlay').hidden=true;modalSubmit=null}function field(label,name,value='',type='text',required=false){return `<label class="field"><span>${esc(label)}</span><input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='text'?'maxlength="300"':''}></label>`}function area(label,name,value=''){return `<label class="field"><span>${esc(label)}</span><textarea name="${name}">${esc(value)}</textarea></label>`}function selectField(label,name,opts){return `<label class="field"><span>${esc(label)}</span><select name="${name}">${opts}</select></label>`}function groupDialog(g){openModal(g?'Rename group':'Create group',field('Group name','name',g?.name||'','text',true),f=>{let n=f.get('name').trim();if(!n)return false;if(g)g.name=n;else state.groups.push({id:uid(),name:n,lists:[]});commit();return true},g?'Save':'Create group')}
function listDialog(g,l){openModal(l?'Edit list':'Create list',field('List name','name',l?.name||'','text',true)+area('Description (optional)','description',l?.description||'')+selectField('Group','group',state.groups.map(x=>`<option value="${esc(x.id)}" ${x.id===g.id?'selected':''}>${esc(x.name)}</option>`).join(''))+(l?'<button type="button" class="danger small" id="deleteList">Delete this list</button>':''),f=>{const n=f.get('name').trim();if(!n)return false;const dest=state.groups.find(x=>x.id===f.get('group'));if(!dest)return false;if(l){l.name=n;l.description=f.get('description');if(dest!==g){g.lists.splice(g.lists.indexOf(l),1);dest.lists.push(l)}}else{l={id:uid(),name:n,description:f.get('description'),tasks:[]};dest.lists.push(l);state.selected=l.id;query='';filter='All'}commit();return true},l?'Save':'Create list');if(l)$('deleteList').onclick=()=>{if(confirm(`Delete "${l.name}" and all its tasks?`)){g.lists.splice(g.lists.indexOf(l),1);closeModal();commit()}}}
function taskDialog(t){const c=current();if(!c)return;const l=c.l,sub=(t?.subtasks||[]).map(s=>({...s}));openModal(t?'Edit task':'New task',field('Task name','name',t?.name||'','text',true)+selectField('Status','status',statuses.map(s=>option(s,t?.status||statuses[0])).join(''))+field('Due date','due',t?.due||'','date')+selectField('Priority','priority',priorities.map(s=>option(s,t?.priority||'Normal')).join(''))+area('Notes','notes',t?.notes||'')+'<div class="subhead">Checklist <button type="button" class="outline small" id="addSub">＋ Item</button></div><div id="subrows"></div>',f=>{const n=f.get('name').trim();if(!n)return false;const changes={name:n,status:f.get('status'),due:f.get('due'),priority:f.get('priority'),notes:f.get('notes'),subtasks:sub.filter(s=>s.name.trim()).map(s=>({...s,name:s.name.trim()}))};if(t)Object.assign(t,changes);else l.tasks.push({...newTask(n),...changes});commit();return true},t?'Save task':'Create task');function drawSub(){$('subrows').innerHTML=sub.map((s,i)=>`<div class="subrow"><input type="checkbox" aria-label="Checklist complete" data-si="${i}" data-sf="done" ${s.done?'checked':''}><input type="text" aria-label="Checklist item" value="${esc(s.name)}" placeholder="Checklist item" data-si="${i}" data-sf="name"><button type="button" class="icon danger" data-remove-sub="${i}" aria-label="Remove checklist item">×</button></div>`).join('');$('subrows').querySelectorAll('[data-sf]').forEach(el=>el.addEventListener('input',()=>{sub[+el.dataset.si][el.dataset.sf]=el.type==='checkbox'?el.checked:el.value}));$('subrows').querySelectorAll('[data-remove-sub]').forEach(el=>el.onclick=()=>{sub.splice(+el.dataset.removeSub,1);drawSub()})}$('addSub').onclick=()=>{sub.push({id:uid(),name:'',done:false});drawSub();$('subrows').querySelector('.subrow:last-child input[type=text]')?.focus()};drawSub()}
function moveTask(t){const c=current();const lists=state.groups.flatMap(g=>g.lists.filter(l=>l.id!==c.l.id).map(l=>({g,l})));if(!lists.length){notify('Create another list first.');return}openModal('Move task',selectField('Destination list','list',lists.map(({g,l})=>`<option value="${esc(l.id)}">${esc(g.name+' / '+l.name)}</option>`).join('')),f=>{const target=findList(f.get('list'));if(!target)return false;c.l.tasks.splice(c.l.tasks.indexOf(t),1);target.l.tasks.push(t);commit();return true},'Move task')}
$('newGroup').onclick=()=>groupDialog();$('toggleSide').onclick=()=>$('sidebar').classList.toggle('closed');$('closeDialog').onclick=closeModal;$('cancelDialog').onclick=closeModal;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden)closeModal()});$('dialogForm').onsubmit=e=>{e.preventDefault();if(modalSubmit?.(new FormData(e.currentTarget))!==false)closeModal()};document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const {action,id}=b.dataset,c=current(),g=state.groups.find(x=>x.id===id),li=findList(id),t=c?.l.tasks.find(x=>x.id===id);switch(action){case 'newGroup':groupDialog();break;case 'editGroup':if(g)groupDialog(g);break;case 'deleteGroup':if(g&&confirm(`Delete group "${g.name}" and all its lists and tasks?`)){state.groups.splice(state.groups.indexOf(g),1);commit()}break;case 'addList':if(g)listDialog(g);break;case 'editList':if(li)listDialog(li.g,li.l);break;case 'select':selectList(id);break;case 'addTask':taskDialog();break;case 'editTask':if(t)taskDialog(t);break;case 'moveTask':if(t)moveTask(t);break;case 'deleteTask':if(t&&confirm(`Delete task "${t.name}"?`)){c.l.tasks.splice(c.l.tasks.indexOf(t),1);commit()}break;case 'filter':filter=id;renderMain();break;case 'clearFilters':query='';filter='All';renderMain();break}});document.addEventListener('change',e=>{const el=e.target.closest('[data-field]');if(!el)return;const t=current()?.l.tasks.find(t=>t.id===el.dataset.id);if(!t)return;const f=el.dataset.field;if(f==='done')t.status=el.checked?'Done':'Not started';else t[f]=el.value;commit()});
function targetFor(el){if(!drag)return null;if(drag.type==='group')return el.closest('[data-drop=group]');if(drag.type==='list')return el.closest('[data-drop=list]')||el.closest('[data-drop=group]');return el.closest('[data-drop=task]')}function clearDrop(){document.querySelectorAll('.drop-target').forEach(e=>e.classList.remove('drop-target'))}document.addEventListener('dragstart',e=>{const h=e.target.closest('[data-drag]');if(!h)return;drag={type:h.dataset.drag,id:h.dataset.id};e.dataTransfer.setData('text/plain',drag.id);e.dataTransfer.effectAllowed='move'});document.addEventListener('dragover',e=>{const t=targetFor(e.target);if(!t||t.dataset.id===drag.id)return;e.preventDefault();e.dataTransfer.dropEffect='move';clearDrop();t.classList.add('drop-target')});document.addEventListener('dragend',()=>{drag=null;clearDrop()});function insertRelative(arr,item,target,after){const old=arr.indexOf(item);if(old>=0)arr.splice(old,1);const i=arr.indexOf(target);arr.splice(i<0?arr.length:i+(after?1:0),0,item)}document.addEventListener('drop',e=>{const el=targetFor(e.target);if(!el||el.dataset.id===drag.id)return;e.preventDefault();const id=el.dataset.id,after=e.clientY>el.getBoundingClientRect().top+el.getBoundingClientRect().height/2;if(drag.type==='group'){const a=state.groups.find(g=>g.id===drag.id),b=state.groups.find(g=>g.id===id);if(a&&b)insertRelative(state.groups,a,b,after)}else if(drag.type==='list'){const src=findList(drag.id),dst=findList(id);const dest=dst?.g||state.groups.find(g=>g.id===id);if(src&&dest){src.g.lists.splice(src.g.lists.indexOf(src.l),1);if(dst)insertRelative(dest.lists,src.l,dst.l,after);else dest.lists.push(src.l)}}else{const arr=current()?.l.tasks||[],a=arr.find(t=>t.id===drag.id),b=arr.find(t=>t.id===id);if(a&&b)insertRelative(arr,a,b,after)}drag=null;clearDrop();commit()});
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SZY-Lists-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Backup exported')};$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{const parsed=normalize(JSON.parse(await file.text()));if(confirm('Replace the current workspace with this backup? Export your current workspace first if needed.')){state=parsed;query='';filter='All';commit();notify('Backup imported')}}catch(err){notify('Unable to import: choose a valid SZY JSON backup.')}};ensureSelection();save();render();
