display:block;width:100%;border:1px solid var(--line);border-radius:7px;padding:9px;background:white}.field textarea{min-height:80px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.danger{color:#aa3030}.toast{position:fixed;bottom:18px;right:18px;background:#29243c;color:white;border-radius:8px;padding:11px 15px;z-index:10;max-width:90vw}.toast[hidden]{display:none}.subcheck{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.subcheck input{width:13px;height:13px}.subrow{display:flex;gap:7px;align-items:center;margin:5px 0}.subrow input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:6px}.subrow input[type=checkbox]{flex-shrink:0}.subhead{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-weight:600;font-size:12px}.small{font-size:12px}.row-actions{display:flex;gap:2px;white-space:nowrap}.mobile-toggle{display:none}@media(max-width:760px){header{height:auto;min-height:64px;padding:10px 12px;flex-wrap:wrap}.brand strong{font-size:14px}.header-actions{margin-left:auto;gap:4px}.save{display:none}.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}aside.closed .side-content{display:none}.mobile-toggle{display:inline-block}main{padding:22px 12px}.stats{gap:6px}.stat{padding:10px 8px}.stat b{font-size:21px}.stat span{font-size:11px}.toolbar{gap:6px}h1{font-size:25px}.header-actions button{font-size:12px;padding:6px}.tip{margin:8px}.side-head{margin-bottom:2px}}

.layout{grid-template-columns:235px minmax(0,1fr)}main{padding:24px 26px;overflow:hidden}.group-name{text-align:left;display:flex;align-items:center;justify-content:space-between;gap:5px;padding:7px 5px}.group-head{gap:2px}.active-group{background:var(--tint);border-color:#dcd3ef;color:#51408b}.board-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.board-tools select{background:white;border:1px solid var(--line);border-radius:7px;padding:8px}.nav-arrows{display:flex;gap:4px;margin-left:auto}.board-hint{font-size:12px;color:var(--muted);margin:14px 0 9px}.board{display:flex;align-items:flex-start;gap:16px;overflow-x:auto;overscroll-behavior-inline:contain;padding:4px 3px 20px;min-height:240px;scrollbar-color:#aba0c7 #e8e5ee}.list-card{flex:0 0 348px;width:348px;max-width:calc(100vw - 34px);background:white;border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:0 2px 5px #1b163009}.card-heading{display:flex;align-items:center;gap:8px}.card-heading h2{flex:1;min-width:0;overflow-wrap:anywhere;font-size:17px}.card-desc{font-size:12px;color:var(--muted);margin-top:7px;white-space:pre-wrap;overflow-wrap:anywhere}.folder-form{background:#f7f8fa;border:1px solid var(--line);border-radius:8px;padding:10px;margin:13px 0}.folder-form label{display:block;font-size:12px;font-weight:600;color:var(--muted)}.folder-form input{width:100%;min-width:0;padding:7px;border:1px solid var(--line);border-radius:6px;margin-top:5px;font-weight:400;background:white}.folder-actions{display:flex;align-items:center;gap:8px;margin-top:7px}.folder-open{color:var(--accent);font-size:12px;font-weight:600;text-decoration:none}.folder-open:hover{text-decoration:underline}.card-progress{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:12px 0 5px}.list-card .progress{margin-bottom:12px}.task-items{display:flex;flex-direction:column;gap:7px}.task-card{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}.task-top{displa </style></head><body>
<header><div class="brand"><div class="logo">SZY</div><div><strong>Lists Workstation</strong><small>Company workspace</small></div></div><div class="header-actions"><span class="save" id="saveState">Local storage</span><button class="outline" id="export">Export backup</button><button class="outline" id="import">Import</button><input type="file" id="importFile" accept=".json,application/json" hidden></div></header>
<div class="layout"><aside id="sidebar"><div class="side-head"><strong>MY WORKSPACE</strong><div><button class="icon mobile-toggle" id="toggleSide" aria-label="Toggle workspace">☰</button><button class="icon" id="newGroup" title="New group">＋ Group</button></div></div><div class="side-content"><div id="groups"></div><div class="tip">Choose a group to see all its lists. Drag a list card onto a group to move it.</div></div></aside><main id="main"></main></div>
<div class="overlay" id="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-top"><h2 id="dialogTitle"></h2><button class="icon" id="closeDialog" aria-label="Close">✕</button></div><form id="dialogForm"><div id="dialogBody"></div><div class="actions"><button type="button" class="outline" id="cancelDialog">Cancel</button><button class="primary" type="submit" id="dialogSubmit">Save</button></div></form></section></div><div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';const $=id=>document.getElementById(id),KEY='szy-lists-workstation-v1',statuses=['Not started','In progress','Done','Blocked'],priorities=['Low','Normal','High'];const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const starter=()=>({groups:[{id:uid(),name:'General',lists:[{id:uid(),name:'My first list',description:'',tasks:[]}]}],selected:null});let state,storageError=false;try{const raw=localStorage.getItem(KEY);state=raw?normalize(JSON.parse(raw)):starter()}catch(e){state=starter();storageError=true}let query='',filter='All',drag=null,modalSubmit=null,toastTimer;function driveLink(v){try{const u=new URL(v.trim());return u.protocol==='https:'&&u.hostname==='drive.google.com'&&!u.username&&!u.password?u.href:''}catch{return ''}}function normalize(v){if(!v||!Array.isArray(v.groups))throw Error('Invalid backup');const ids=new Set();const id=x=>{let s=typeof x==='string'&&/^[\w-]{1,100}$/.test(x)?x:uid();if(ids.has(s))s=uid();ids.add(s);return s};const str=x=>typeof x==='string'?x:'';const groups=v.groups.map(g=>{if(!g||!Array.isArray(g.lists))throw Error('Invalid group');return {id:id(g.id),name:str(g.name)||'Untitled group',lists:g.lists.map(l=>{if(!l||!Array.isArray(l.tasks))throw Error('Invalid list');return {id:id(l.id),name:str(l.name)||'Untitled list',description:str(l.description),folder:driveLink(str(l.folder)),tasks:l.tasks.map(t=>{if(!t||typeof t!=='object')throw Error('Invalid task');return {id:id(t.id),name:str(t.name)||'Untitled task',status:statuses.includes(t.status)?t.status:statuses[0],priority:priorities.includes(t.priority)?t.priority:'Normal',due:/^\d{4}-\d{2}-\d{2}$/.test(str(t.due))?t.due:'',notes:str(t.notes),subtasks:Array.isArray(t.subtasks)?t.subtasks.filter(s=>s&&typeof s==='object').map(s=>({id:id(s.id),name:str(s.name),done:!!s.done})):[]}})}})}});return {groups,selected:typeof v.selected==='string'?v.selected:null,selectedGroup:typeof v.selectedGroup==='string'?v.selectedGroup:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageError=false;$('saveState').textContent='✓ Saved on this device'}catch(e){storageError=true;$('saveState').textContent='Not saved — export backup';notify('Local saving unavailable. Export a backup to keep your changes.')}}function notify(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}function findList(id){for(const g of state.groups){const l=g.lists.find(l=>l.id===id);if(l)return {g,l}}return null}function current(){return findList(state.selected)}function activeGroup(){return state.groups.find(g=>g.id===state.selectedGroup)||current()?.g||state.groups[0]}function ensureSelection(){const g=activeGroup();state.selectedGroup=g?.id||null;state.selected=g?.lists.find(l=>l.id===state.selected)?.id||g?.lists[0]?.id||null}function commit(){ensureSelection();save();render()}function selectGroup(id){state.selectedGroup=id;state.selected=null;query='';filter='All';commit();if($('board'))$('board').scrollLeft=0}function findTask(id){for(const g of state.groups)for(const l of g.lists){const t=l.tasks.find(t=>t.id===id);if(t)return {g,l,t}}return null}function option(v,selected){return `<option${v===selected?' selected':''}>${esc(v)}</option>`}function grip(type,id){return `<span class="grip" draggable="true" data-drag="${type}" data-id="${esc(id)}" title="Drag to move" aria-label="Drag to move">⋮⋮</span>`}
function render(){renderSide();renderMain()}function renderSide(){$('groups').innerHTML=state.groups.map(g=>`<section class="group ${g.id===activeGroup()?.id?'active-group':''}" data-drop="group" data-id="${esc(g.id)}"><div class="group-head">${grip('group',g.id)}<button class="group-name" data-action="selectGroup" data-id="${esc(g.id)}" title="${esc(g.name)}">${esc(g.name)} <span class="list-count">${g.lists.length}</span></button><button class="icon" data-action="editGroup" data-id="${esc(g.id)}" title="Rename group">✎</button><button class="icon danger" data-action="deleteGroup" data-id="${esc(g.id)}" title="Delete group">×</button></div></section>`).join('')||'<div class="tip">Create a group to get started.</div>'}
function newTask(name){return {id:uid(),name,status:statuses[0],priority:'Normal',due:'',notes:'',subtasks:[]}}
function renderMain(){const g=activeGroup(),oldScroll=$('board')?.scrollLeft||0;if(!g){$('main').innerHTML='<div class="empty"><strong>Your workspace is ready</strong>Create a group to start organising your tasks.<br><br><button class="primary" data-action="newGroup">＋ New group</button></div>';return}const tasks=g.lists.flatMap(l=>l.tasks),done=tasks.filter(t=>t.status==='Done').length;$('main').innerHTML=`<div class="crumb">Workspace / ${esc(g.name)}</div><div class="page-title"><h1>${esc(g.name)}</h1><button class="primary" data-action="addList" data-id="${esc(g.id)}">＋ New list</button></div><div class="description">${g.lists.length} lists · ${done}/${tasks.length} tasks completed</div><div class="board-tools"><input id="search" class="search" placeholder="Search tasks or lists…" aria-label="Search tasks or lists" value="${esc(query)}"><select id="statusFilter" aria-label="Filter tasks">${['All',...statuses].map(s=>option(s,filter)).join('')}</select><button class="outline" data-action="clearFilters">Clear</button><div class="nav-arrows"><button class="outline" id="prev" aria-label="Scroll left">←</button><button class="outline" id="next" aria-label="Scroll right">→</button></div></div><div class="board-hint">Scroll sideways to see more lists · Drag list handles to reorder or drop on a group to move.</div><div class="board" id="board" tabindex="0" aria-label="Scrollable lists"></div>`;renderRows();$('board').scrollLeft=oldScroll;$('search').oninput=e=>{query=e.target.value;renderRows()};$('statusFilter').onchange=e=>{filter=e.target.value;renderRows()};$('prev').onclick=()=>$('board').scrollBy({left:-370,behavior:'smooth'});$('next').onclick=()=>$('board').scrollBy({left:370,behavior:'smooth'})}
function renderRows(){const g=activeGroup(),board=$('board');if(!g||!board)return;board.innerHTML=g.lists.map(l=>{const done=l.tasks.filter(t=>t.status==='Done').length,pc=l.tasks.length?Math.round(done/l.tasks.length*100):0,ts=l.tasks.filter(t=>(filter==='All'||t.status===filter)&&[l.name,t.name,t.notes,t.status,t.priority,...t.subtasks.map(s=>s.name)].join(' ').toLowerCase().includes(query.toLowerCase()));return `<article class="list-card" data-drop="list" data-id="${esc(l.id)}"><div class="card-heading">${grip('list',l.id)}<h2>${esc(l.name)}</h2><button class="icon" data-action="editList" data-id="${esc(l.id)}" title="Edit list">⋯</button></div>${l.description?`<div class="card-desc">${esc(l.description)}</div>`:''}<form class="folder-form" data-folder="${esc(l.id)}"><label>Google Drive folder<input name="folder" type="url" placeholder="Paste Google Drive folder link" value="${esc(l.folder||'')}"></label><div class="folder-actions"><button class="outline small" type="submit">Save link</button>${driveLink(l.folder||'')?`<a class="folder-open" href="${esc(driveLink(l.folder))}" target="_blank" rel="noopener noreferrer">Open folder ↗</a>`:''}</div></form><div class="card-progress"><span>${done}/${l.tasks.length} completed</span><span>${pc}%</span></div><div class="progress"><div style="width:${pc}%"></div></div><div class="task-items">${ts.map(t=>`<div class="task-card" data-drop="task" data-id="${esc(t.id)}"><div class="task-top">${grip('task',t.id)}<input type="checkbox" data-field="done" data-id="${esc(t.id)}" aria-label="Complete ${esc(t.name)}" ${t.status==='Done'?'checked':''}><button class="taskname ${t.status==='Done'?'done':''}" data-action="editTask" data-id="${esc(t.id)}">${esc(t.name)}</button><button class="icon" data-action="editTask" data-id="${esc(t.id)}" title="Edit task">✎</button><button class="icon" data-action="moveTask" data-id="${esc(t.id)}" title="Move task">↗</button><button class="icon danger" data-action="deleteTask" data-id="${esc(t.id)}" title="Delete task">×</button></div><div class="task-meta"><select class="status s${statuses.indexOf(t.status)}" data-field="status" data-id="${esc(t.id)}" aria-label="Task status">${statuses.map(s=>option(s,t.status)).join('')}</select>${t.due?`<span>Due ${esc(t.due)}</span>`:''}${t.priority!=='Normal'?`<span>${esc(t.priority)} priority</span>`:''}</div>${t.notes?`<div class="tasknote">${esc(t.notes)}</div>`:''}${t.subtasks.map(sub=>`<label class="subcheck"><input type="checkbox" data-field="subtask" data-id="${esc(t.id)}" data-sub="${esc(sub.id)}" ${sub.done?'checked':''}><span class="${sub.done?'subdone':''}">${esc(sub.name)}</span></label>`).join('')}</div>`).join('')||`<div class="card-empty">${l.tasks.length?'No matching tasks':'No tasks yet. Add one below.'}</div>`}</div><form class="quick" data-quick="${esc(l.id)}"><input name="name" placeholder="Add a to-do…" aria-label="New task name" required maxlength="300"><button class="outline" type="submit">＋ Add</button></form><button class="add-detail" data-action="addTask" data-id="${esc(l.id)}">＋ Task with details / checklist</button></article>`}).join('')+`<button class="new-card" data-action="addList" data-id="${esc(g.id)}">＋ New list</button>`}
function openModal(title,html,cb,label='Save'){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=html;$('dialogSubmit').textContent=label;modalSubmit=cb;$('overlay').hidden=false;setTimeout(()=>$('dialogBody').querySelector('input,select,textarea')?.focus(),0)}function closeModal(){$('overlay').hidden=true;modalSubmit=null}function field(label,name,value='',type='text',required=false){return `<label class="field"><span>${esc(label)}</span><input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='text'?'maxlength="300"':''}></label>`}function area(label,name,value=''){return `<label class="field"><span>${esc(label)}</span><textarea name="${name}">${esc(value)}</textarea></label>`}function selectField(label,name,opts){return `<label class="field"><span>${esc(label)}</span><select name="${name}">${opts}</select></label>`}function groupDialog(g){openModal(g?'Rename group':'Create group',field('Group name','name',g?.name||'','text',true),f=>{let n=f.get('name').trim();if(!n)return false;if(g)g.name=n;else {const group={id:uid(),name:n,lists:[]};state.groups.push(group);state.selectedGroup=group.id}commit();return true},g?'Save':'Create group')}
function listDialog(g,l){openModal(l?'Edit list':'Create list',field('List name','name',l?.name||'','text',true)+area('Description (optional)','description',l?.description||'')+field('Google Drive folder link (optional)','folder',l?.folder||'','url')+selectField('Group','group',state.groups.map(x=>`<option value="${esc(x.id)}" ${x.id===g.id?'selected':''}>${esc(x.name)}</option>`).join(''))+(l?'<button type="button" class="danger small" id="deleteList">Delete this list</button>':''),f=>{const n=f.get('name').trim();if(!n)return false;const dest=state.groups.find(x=>x.id===f.get('group'));if(!dest)return false;const raw=f.get('folder').trim(),folder=driveLink(raw);if(raw&&!folder){notify('Enter a valid https://drive.google.com link.');return false}if(l){l.name=n;l.description=f.get('description');l.folder=folder;if(dest!==g){g.lists.splice(g.lists.indexOf(l),1);dest.lists.push(l)}}else{l={id:uid(),name:n,description:f.get('description'),folder,tasks:[]};dest.lists.push(l);state.selected=l.id;query='';filter='All'}state.selectedGroup=dest.id;commit();return true},l?'Save':'Create list');if(l)$('deleteList').onclick=()=>{if(confirm(`Delete "${l.name}" and all its tasks?`)){g.lists.splice(g.lists.indexOf(l),1);closeModal();commit()}}}
function taskDialog(t,l){if(!l)return;const sub=(t?.subtasks||[]).map(s=>({...s}));openModal(t?'Edit task':'New task',field('Task name','name',t?.name||'','text',true)+selectField('Status','status',statuses.map(s=>option(s,t?.status||statuses[0])).join(''))+field('Due date','due',t?.due||'','date')+selectField('Priority','priority',priorities.map(s=>option(s,t?.priority||'Normal')).join(''))+area('Notes','notes',t?.notes||'')+'<div class="subhead">Checklist <button type="button" class="outline small" id="addSub">＋ Item</button></div><div id="subrows"></div>',f=>{const n=f.get('name').trim();if(!n)return false;const changes={name:n,status:f.get('status'),due:f.get('due'),priority:f.get('priority'),notes:f.get('notes'),subtasks:sub.filter(s=>s.name.trim()).map(s=>({...s,name:s.name.trim()}))};if(t)Object.assign(t,changes);else l.tasks.push({...newTask(n),...changes});commit();return true},t?'Save task':'Create task');function drawSub(){$('subrows').innerHTML=sub.map((s,i)=>`<div class="subrow"><input type="checkbox" aria-label="Checklist complete" data-si="${i}" data-sf="done" ${s.done?'checked':''}><input type="text" aria-label="Checklist item" value="${esc(s.name)}" placeholder="Checklist item" data-si="${i}" data-sf="name"><button type="button" class="icon danger" data-remove-sub="${i}" aria-label="Remove checklist item">×</button></div>`).join('');$('subrows').querySelectorAll('[data-sf]').forEach(el=>el.addEventListener('input',()=>{sub[+el.dataset.si][el.dataset.sf]=el.type==='checkbox'?el.checked:el.value}));$('subrows').querySelectorAll('[data-remove-sub]').forEach(el=>el.onclick=()=>{sub.splice(+el.dataset.removeSub,1);drawSub()})}$('addSub').onclick=()=>{sub.push({id:uid(),name:'',done:false});drawSub();$('subrows').querySelector('.subrow:last-child input[type=text]')?.focus()};drawSub()}
function moveTask(t){const c=findTask(t.id);if(!c)return;const lists=state.groups.flatMap(g=>g.lists.filter(l=>l.id!==c.l.id).map(l=>({g,l})));if(!lists.length){notify('Create another list first.');return}openModal('Move task',selectField('Destination list','list',lists.map(({g,l})=>`<option value="${esc(l.id)}">${esc(g.name+' / '+l.name)}</option>`).join('')),f=>{const target=findList(f.get('list'));if(!target)return false;c.l.tasks.splice(c.l.tasks.indexOf(t),1);target.l.tasks.push(t);commit();return true},'Move task')}
$('newGroup').onclick=()=>groupDialog();$('toggleSide').onclick=()=>$('sidebar').classList.toggle('closed');$('closeDialog').onclick=closeModal;$('cancelDialog').onclick=closeModal;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden)closeModal()});$('dialogForm').onsubmit=e=>{e.preventDefault();if(modalSubmit?.(new FormData(e.currentTarget))!==false)closeModal()};document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const {action,id}=b.dataset,c=findTask(id),g=state.groups.find(x=>x.id===id),li=findList(id),t=c?.t;switch(action){case 'newGroup':groupDialog();break;case 'editGroup':if(g)groupDialog(g);break;case 'deleteGroup':if(g&&confirm(`Delete group "${g.name}" and all its lists and tasks?`)){state.groups.splice(state.groups.indexOf(g),1);commit()}break;case 'addList':if(g)listDialog(g);break;case 'editList':if(li)listDialog(li.g,li.l);break;case 'selectGroup':selectGroup(id);break;case 'addTask':if(li)taskDialog(null,li.l);break;case 'editTask':if(t)taskDialog(t,c.l);break;case 'moveTask':if(t)moveTask(t);break;case 'deleteTask':if(t&&confirm(`Delete task "${t.name}"?`)){c.l.tasks.splice(c.l.tasks.indexOf(t),1);commit()}break;case 'filter':filter=id;renderMain();break;case 'clearFilters':query='';filter='All';renderMain();break}});document.addEventListener('change',e=>{const el=e.target.closest('[data-field]');if(!el)return;const t=findTask(el.dataset.id)?.t;if(!t)return;const f=el.dataset.field;if(f==='done')t.status=el.checked?'Done':'Not started';else if(f==='subtask'){const sub=t.subtasks.find(s=>s.id===el.dataset.sub);if(sub)sub.done=el.checked}else t[f]=el.value;commit()});
function targetFor(el){if(!drag)return null;if(drag.type==='group')return el.closest('[data-drop=group]');if(drag.type==='list')return el.closest('[data-drop=list]')||el.closest('[data-drop=group]');return el.closest('[data-drop=task]')||el.closest('[data-drop=list]')}function clearDrop(){document.querySelectorAll('.drop-target').forEach(e=>e.classList.remove('drop-target'))}document.addEventListener('dragstart',e=>{const h=e.target.closest('[data-drag]');if(!h)return;drag={type:h.dataset.drag,id:h.dataset.id};e.dataTransfer.setData('text/plain',drag.id);e.dataTransfer.effectAllowed='move'});document.addEventListener('dragover',e=>{const t=targetFor(e.target);if(!t||t.dataset.id===drag.id)return;e.preventDefault();e.dataTransfer.dropEffect='move';clearDrop();t.classList.add('drop-target')});document.addEventListener('dragend',()=>{drag=null;clearDrop()});function insertRelative(arr,item,target,after){const old=arr.indexOf(item);if(old>=0)arr.splice(old,1);const i=arr.indexOf(target);arr.splice(i<0?arr.length:i+(after?1:0),0,item)}document.addEventListener('drop',e=>{const el=targetFor(e.target);if(!el||el.dataset.id===drag.id)return;e.preventDefault();const id=el.dataset.id,r=el.getBoundingClientRect(),after=drag.type==='list'&&el.classList.contains('list-card')?e.clientX>r.left+r.width/2:e.clientY>r.top+r.height/2;if(drag.type==='group'){const a=state.groups.find(g=>g.id===drag.id),b=state.groups.find(g=>g.id===id);if(a&&b)insertRelative(state.groups,a,b,after)}else if(drag.type==='list'){const src=findList(drag.id),dst=findList(id);const dest=dst?.g||state.groups.find(g=>g.id===id);if(src&&dest){src.g.lists.splice(src.g.lists.indexOf(src.l),1);if(dst)insertRelative(dest.lists,src.l,dst.l,after);else dest.lists.push(src.l)}}else{const src=findTask(drag.id),dst=findTask(id),dest=dst?.l||findList(id)?.l;if(src&&dest){src.l.tasks.splice(src.l.tasks.indexOf(src.t),1);if(dst)insertRelative(dest.tasks,src.t,dst.t,after);else dest.tasks.push(src.t)}}drag=null;clearDrop();commit()});
document.addEventListener('submit',e=>{const form=e.target;if(form.matches('[data-quick]')){e.preventDefault();const l=findList(form.dataset.quick)?.l,n=new FormData(form).get('name').trim();if(l&&n){l.tasks.push(newTask(n));const id=l.id;commit();document.querySelector(`[data-quick="${id}"] input`)?.focus({preventScroll:true})}}else if(form.matches('[data-folder]')){e.preventDefault();const l=findList(form.dataset.folder)?.l,raw=new FormData(form).get('folder').trim(),url=driveLink(raw);if(raw&&!url){notify('Enter a valid https://drive.google.com link.');return}if(l){l.folder=url;commit();notify(url?'Folder link saved':'Folder link removed')}}});
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SZY-Lists-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Backup exported')};$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{const parsed=normalize(JSON.parse(await file.text()));if(confirm('Replace the current workspace with this backup? Export your current workspace first if needed.')){state=parsed;query='';filter='All';commit();notify('Backup imported')}}catch(err){notify('Unable to import: choose a valid SZY JSON backup.')}};ensureSelection();save();render();
